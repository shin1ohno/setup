name: Supply chain

# Lints every workflow on every PR and on main. No path filter and no `if:`:
# a filter that skips `.github/**` would let a workflow change merge unlinted.

on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Exact zizmor release, raised by hand: Dependabot bumps the action
          # pin above but not this input.
          version: 1.32.0
          advanced-security: false
          # Keeps impostor-commit and ref-version-mismatch, which catch a SHA
          # that is not on the action's repo or whose version comment lies.
          online-audits: true

      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
