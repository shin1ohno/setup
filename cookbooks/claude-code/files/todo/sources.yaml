# TODO capture sources for /todo-collect (design: ~/.claude/docs/todo-management.md).
#
# This is the cookbook-managed copy — PERSONAL sources only. Work sources
# (Mercari Slack etc.) belong in ~/.claude/todo/sources.local.yaml (unmanaged,
# same schema, merged at runtime by `name`; local wins on conflict). Never put
# work source definitions in this public repo.
#
# Schema per entry:
#   name:    unique id (ledger + dedup key namespace)
#   class:   explicit  — user made a deliberate mark → auto-remember + receipt
#            inferred  — extraction guesses intent → candidates only, approval required
#   adapter: slack-saved | slack-reaction | slack-self-dm | google-tasks |
#            transcript-deferral | calendar-notion-notes | apple-reminders
#   query:   adapter-specific selector (tasklist name, emoji, lookback window,
#            search modifier; for apple-reminders: the Reminders list name to
#            capture from)
#   sink:    ai-memory | memory-work   (work sources MUST sink to memory-work)
#   enabled: true | false
#   max_age_days: N   (inferred only, optional) — candidates whose ORIGIN date
#            (the message / meeting date, not the day the loop saw them) is older
#            than N days are aged out by todo_queue.py before they reach the
#            approval queue; each one is listed in the run log, never silently
#            dropped. Explicit sources are never aged (a deliberate mark is a
#            deliberate mark).
#
# queue: (top-level, optional; replaced WHOLESALE by sources.local.yaml like
#         mirror:) knobs of the approval queue candidates.jsonl
#   ttl_days:        a candidate that sat in the queue this long since first_seen
#                    is expired (an `expired` disposition is written; it can be
#                    revived from /todo-approve)                  default 21
#   dm_per_run_max:  cap on new per-candidate DMs per collect run  default 10
#                    (only used when queue_surface is slack-self-dm)
#   snooze_days:     how long a snooze reaction defers a candidate   default 7
#
# surfaces: (top-level, optional) where the approval queue is surfaced
#   queue_surface: none | slack-self-dm     default none = file surface only
#                  (candidates.jsonl + /todo-approve). slack-self-dm adds a
#                  per-candidate self-DM with reaction-based approval
#                  (docs/todo-management.md "Approval surfaces").
#   channel:       the self-DM channel id to post to and read back from
#   reactions:     { approve, reject, snooze, never } -> the emoji NAMES the
#                  connector returns in its `Reactions:` line
#                  (defaults white_check_mark / x / zzz / mute — measure them)
#   channel and reactions are workspace-specific values and belong in
#   sources.local.yaml, never here.
#
# apple-reminders adapter: sweeps the named Reminders list via `remind --dump`.
# A reminder is a capture candidate when it is NOT completed, carries no
# [ai-todo:<memory-id>] token in its notes, no open memory todo references
# its externalId (provenance `reminders:<externalId>`), and its due (if any)
# falls within the capture horizon (default 14 days; optional top-level
# `capture: { due_horizon_days: N }`, negative disables) — far-future scheduled
# reminders stay in Reminders, which already owns their notification. Capture
# lists = every apple-reminders source's query list + the mirror list below.
# explicit class → auto-remember with provenance `reminders:<externalId>`.
# The source's `sink` is the DEFAULT for its candidates: a mixed personal/work
# list gets sensitivity-routed at normalization (work-shaped content →
# memory-work), same routing doctrine as todo-management.md.
#
# mirror: section (end of file) — Apple Reminders is also a SURFACE for open
# memory todos: /todo-collect Step 6 mirrors each open todo of the listed
# stores 1:1 into `mirror.list` via remind_sync.rb. Link is stateless: the
# reminder carries an [ai-todo:<memory-id>] token line in its notes; no state
# file — every sync plan is re-derived from the two dumps (remind --dump JSON
# + memory dump JSON). Keys:
#   list:              Reminders list holding the mirrors (created if absent)
#   stores:            [{ name: <memory store>, policy: full | title-link }]
#                      full       — title = first sentence of content (prefix
#                                   stripped, 100-char cap); notes = close-
#                                   condition line + first URL + token line
#                      title-link — same title; notes = first URL + token line
#                                   ONLY (no body text egresses to iCloud)
#   complete_captured: whether close propagation (rule 5: memory todo gone →
#                      complete the reminder) also applies to capture-origin
#                      reminders
#
# Example local override (~/.claude/todo/sources.local.yaml) for work Slack:
#   sources:
#     - { name: slack-saved,    class: explicit, adapter: slack-saved,    query: "",        sink: memory-work, enabled: true }
#     - { name: slack-pin,      class: explicit, adapter: slack-reaction, query: "pushpin", sink: memory-work, enabled: true }
#     - { name: slack-self-dm,  class: explicit, adapter: slack-self-dm,  query: "",        sink: memory-work, enabled: true }
#     - { name: work-cal-notes, class: inferred, adapter: calendar-notion-notes, query: "7d", sink: memory-work, enabled: true }

sources:
  - name: google-tasks-inbox
    class: explicit
    adapter: google-tasks
    query: "@default"
    sink: ai-memory
    enabled: true

  - name: transcript-deferrals
    class: inferred
    adapter: transcript-deferral
    query: "7d"
    sink: ai-memory
    enabled: true

  - name: reminders-inbox
    class: explicit
    adapter: apple-reminders
    query: "Inbox"
    sink: ai-memory
    enabled: true

# Apple Reminders mirror — public default mirrors the PERSONAL store only
# (ai-memory, policy full). The work store (memory-work) is deliberately NOT
# mirrored here: opt in via ~/.claude/todo/sources.local.yaml (zp-SHIN overlay)
# with `policy: title-link`, so no work-todo body text egresses to iCloud
# (title + first URL + link token only — iCloud is a third-party egress
# surface, same judgment as knowledge-persistence.md "local is NOT air-gapped").
# Merge rule: when sources.local.yaml defines its own `mirror:` section it
# replaces this one WHOLESALE (no per-key deep-merge) — the overlay copy must
# therefore restate the full section including the ai-memory entry.
mirror:
  list: "Claude"
  stores:
    - { name: ai-memory, policy: full }
  complete_captured: true # apply rule 5 (close propagation → complete) to capture-origin reminders too

# Approval queue (todo_queue.py). Public defaults — an overlay that defines its
# own `queue:` / `surfaces:` replaces each block wholesale.
queue: { ttl_days: 21, dm_per_run_max: 10 }
surfaces: { queue_surface: none }
