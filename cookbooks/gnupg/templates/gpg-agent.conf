# pinentry program — platform-specific path is templated from
# node[:gnupg][:pinentry_program] (set by cookbooks/gnupg/{darwin,linux}.rb,
# each before it includes the shared cookbooks/gnupg/common.rb that renders
# this template).
pinentry-program <%= node[:gnupg][:pinentry_program] %>

# Cache settings (1 month = 2592000 seconds)
default-cache-ttl 2592000
max-cache-ttl 2592000

# Allow loopback pinentry for non-TTY environments (e.g., Claude Code, IDEs)
allow-loopback-pinentry
