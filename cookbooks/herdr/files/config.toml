onboarding = false

# ── Converted from ~/.tmux.conf (verified against herdr 0.6.6) ───────────────

[keys]
# prefix C-a  (tmux: set-option -g prefix C-a)
prefix = "ctrl+a"

# copy mode  (tmux: bind v copy-mode) — default was prefix+[
copy_mode = "prefix+v"

# splits — faithful to tmux muscle memory:
#   tmux `bind | split-window -h`  → side-by-side (vertical divider)
#   tmux `bind \ split-window -v`  → stacked      (horizontal divider)
split_vertical = "prefix+|"
split_horizontal = "prefix+\\"

# reload config  (tmux: bind R source-file) — matches herdr default prefix+shift+r
reload_config = "prefix+shift+r"

# pane focus = prefix-less Ctrl+hjkl, matching the tmux + smart-splits.nvim
# muscle memory (tmux used vim-tmux-navigator's bare Ctrl-hjkl).
# CAVEAT: herdr is NOT a smart-splits.nvim multiplexer target (it supports
# tmux/wezterm/kitty/zellij only), so seamless vim-split <-> pane transit does
# NOT work — inside neovim, smart-splits intercepts Ctrl+hjkl and stops at the
# window edge instead of crossing into the next herdr pane. These bindings move
# between herdr panes only outside neovim.
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

[theme]
# tmux: arcticicestudio/nord-tmux
name = "nord"

[ui]
# tmux: set -g mouse on  (herdr default is already true; explicit for clarity)
mouse_capture = true

# Label split-pane borders with the detected agent (default false). Named
# agents (`herdr agent start <name>`) are the unit the CLI addresses, so
# reading which pane holds which agent off the border beats `agent list`.
show_agent_labels_on_pane_borders = true

[advanced]
# tmux: set -g history-limit 50000  (NOTE: herdr counts BYTES, not lines) → ~20 MB
scrollback_limit_bytes = 20971520

[session]
# tmux: tmux-continuum @continuum-restore 'on' — herdr resumes Claude/Codex/etc.
# native agent sessions after a server restart.
resume_agents_on_restore = true

# ── Japanese input (no tmux counterpart; herdr 0.8.0 [experimental]) ─────────
# These keys are documented as experimental, so re-run `herdr config check`
# after a version bump — the validator reports an unknown key by name and
# exits 1, which is how a rename surfaces (verified: it flags an injected
# bogus key while accepting every key here).
[experimental]
# Prefix mode (ctrl+a) with a Japanese IME active otherwise loses the
# following keystroke to the IME. This switches the host input source to an
# ASCII layout for the duration of prefix mode and restores it on exit.
# macOS/Windows only and best-effort per upstream, so it is a no-op on the
# Linux hosts — it is here for `air`.
switch_ascii_input_source_in_prefix = true

# Agent TUIs paint their own cursor and hide the terminal one, which leaves
# macOS input methods with nowhere to anchor the candidate window when typing
# Japanese into an agent. This exposes the focused pane's cursor to the outer
# terminal. The trade-off upstream names is a spurious cursor in apps that
# hide it WITHOUT painting a replacement (vim normal mode), which is exactly
# why the allow-list below is set rather than left empty (empty = every
# focused pane).
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]
# Matches the current upstream default; pinned because the surrounding keys
# are experimental and a default shift would change the cursor silently.
cjk_ime_cursor_shape = "steady_block"
