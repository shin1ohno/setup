groups:
  - name: unbound-resolver
    interval: 30s
    rules:
      # The PVE host's unbound-watchdog timer probes CT 118 (.61) over the LAN
      # every 60s and exports these via node_exporter textfile. `up == 0` means
      # the resolver did not answer the canary AND a restart failed to fix it
      # (the watchdog retries once before reporting 0) — a real LAN DNS outage.
      - alert: UnboundResolverDown
        expr: unbound_watchdog_up == 0
        for: 2m
        labels:
          severity: critical
          component: dns
        annotations:
          summary: "LAN DNS resolver (CT 118 / {{ $labels.target }}) is down"
          description: |
            unbound-watchdog on the PVE host could not resolve its canary via
            {{ $labels.target }} and a restart did not recover it. The whole LAN
            (DHCP DNS + every LXC) loses name resolution. Check `pct exec 118 --
            systemctl status unbound` and the unbound-watchdog journal on pro.

      # The forward path is the OTHER half of the resolver and had no rule at all
      # until 2026-08-24: unbound_watchdog_forward_path_up has been exported
      # since the 2026-07-25 wedge (setup#748-#752) but nothing alerted on it, so
      # the metric that exists specifically to catch "every public name
      # SERVFAILs" was write-only. Local-data answers keep flowing during a
      # forward wedge, so UnboundResolverDown above stays silent through it.
      #
      # The watchdog reports 0 only after flush_infra AND a restart both failed
      # to recover -- or while RESTART_MIN_INTERVAL is suppressing the restart,
      # during which the forward path really is down for clients. Either way 5m
      # of continuous 0 is a genuine outage, not a transient.
      - alert: UnboundForwardPathDown
        expr: unbound_watchdog_forward_path_up == 0
        for: 5m
        labels:
          severity: critical
          component: dns
        annotations:
          summary: "LAN DNS forward path (CT 118 / {{ $labels.target }}) is down"
          description: |
            unbound answers local-data but cannot resolve public names through
            its DoT forwarders, and the watchdog's flush_infra + restart did not
            recover it. Every public hostname SERVFAILs LAN-wide while home.local
            keeps working. Check the `.` forward-zone upstreams from CT 118
            (`pct exec 118 -- unbound-control lookup one.one.one.one`) and
            whether :853 egress is reachable.

      # Distinct from the flapping alert below: that one counts unbound restarts,
      # this one counts forward wedges that flush_infra recovered WITHOUT a
      # restart. Those leave restart_total flat, so they are invisible to it.
      - alert: UnboundForwardPathFlapping
        expr: increase(unbound_watchdog_forward_wedge_total[1h]) >= 3
        for: 1m
        labels:
          severity: warning
          component: dns
        annotations:
          summary: "unbound forward path wedged >=3x in 1h (auto-recovered)"
          description: |
            The watchdog cleared {{ $value }} forwarder wedges in the last hour.
            Each one was self-healed, but a repeating wedge points at an unstable
            upstream or DoT path rather than a one-off blip.

      # IPv6 transport probe (added with the 2026-08 dual-stack rollout). WARNING,
      # not critical, and deliberately not wired to any auto-restart: v4 clients
      # are unaffected, and the usual causes (resolver lost its ULA, a route went
      # away, the fd97:b085:767d::/64 access-control line got dropped) are not
      # things restarting unbound fixes. `for: 10m` rides out an RA/SLAAC
      # re-acquisition without paging.
      - alert: UnboundResolverIPv6Down
        expr: unbound_watchdog_v6_up == 0
        for: 10m
        labels:
          severity: warning
          component: dns
        annotations:
          summary: "LAN DNS resolver unreachable over IPv6 ({{ $labels.target }})"
          description: |
            unbound answers over IPv4 but not over IPv6 transport to its ULA.
            home.local AAAA records still resolve, so clients degrade quietly to
            v4 rather than failing. Check that CT 118 still holds the ULA
            (`pct exec 118 -- ip -6 addr`), that `[::]:53` is still a separate
            listener row in `ss -lntup "sport = :53"`, and that unbound.conf
            still carries the fd97:b085:767d::/64 access-control line.

      # The watchdog auto-recovers wedges, so a single restart is "handled" — but
      # a recurring restart means something keeps wedging unbound (query storm,
      # deployed-but-not-reloaded loop). Surface it so the auto-heal doesn't mask
      # a chronic problem.
      - alert: UnboundResolverFlapping
        expr: increase(unbound_watchdog_restart_total[30m]) >= 2
        for: 1m
        labels:
          severity: warning
          component: dns
        annotations:
          summary: "unbound-watchdog restarted CT 118 resolver >=2x in 30m"
          description: |
            The watchdog auto-recovered unbound {{ $value }} times in 30m — it is
            healing but something keeps wedging it. Investigate the home.local
            forward path / query storm (cf. 2026-05-31 incident).

      # The watchdog itself going silent (timer dead, PVE node-exporter down)
      # would hide both alerts above. Treat a stale textfile as suspicious.
      - alert: UnboundWatchdogStale
        expr: time() - unbound_watchdog_last_check_timestamp_seconds > 600
        for: 5m
        labels:
          severity: warning
          component: dns
        annotations:
          summary: "unbound-watchdog has not reported in >10m"
          description: |
            No fresh unbound-watchdog probe on the PVE host for >10m — the timer
            or PVE node-exporter may be down, blinding the resolver health alerts.
