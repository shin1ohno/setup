# MCP Server Definitions
# =======================
# This file defines MCP servers that will be deployed to:
# - Claude Desktop: ~/Library/Application Support/Claude/claude_desktop_config.json (macOS only)
# - Claude Code USER scope: `claude mcp add` / `add-json` (every platform)
# - Codex CLI: ~/.codex/config.toml
#
# Environment Variables:
#   - Static values: use plain strings
#   - AWS SSM Parameters: use { ssm: "/path/to/parameter" }
#     CONTRACT (2026-08 gap decision): only darwin-pinned servers may use
#     `ssm:` today. The Linux register path (mcp/linux.rb) and the codex
#     render (codex-cli — which skips ALL platform-pinned servers) run with
#     NO auth gate because they resolve zero SSM parameters. Adding `ssm:`
#     to a linux-reachable or unpinned server REQUIRES reinstating the
#     matching require_external_auth gate — see the comments in
#     cookbooks/mcp/linux.rb and cookbooks/codex-cli/default.rb.
#   - Shell environment: use { env: "ENV_VAR_NAME" }
#
# Variables:
#   - ${HOME} will be expanded to the user's home directory
#
# Platform pinning:
#   - `platforms: [darwin]` (or `[linux]`) restricts a server to those hosts;
#     omit the key to deploy everywhere. The token is the renderer's PLATFORM
#     value — `darwin` on macOS, `linux` on everything else, passed by
#     cookbooks/mcp/default.rb. Pin anything whose command path is
#     OS-specific (an iCloud Drive path, a Homebrew prefix).
#
# Desktop delivery of HTTP/SSE servers:
#   Claude Desktop's claude_desktop_config.json is stdio-only, so type:http
#   servers are NOT written there by default. Mark a server `desktop: mcp-remote`
#   to bridge it into the Desktop config as a local stdio entry
#   (`npx -y mcp-remote <url>`), making it usable in Desktop Chat WITHOUT an
#   account-level Custom Connector. Caveat: mcp-remote-bridged servers are
#   Desktop-Chat-only and are NOT visible in Cowork / claude.ai — those surfaces
#   only see account-synced Custom Connectors. Codex CLI always receives http
#   servers natively (type=http in config.toml), independent of this flag.
#
# Claude Code registration (`account_connector`):
#   `desktop:` and Claude Code user-scope registration are INDEPENDENT axes.
#   Servers that are also registered as claude.ai account-level Custom Connectors
#   (memory / roon) sync into Claude Code AUTOMATICALLY (shown as
#   "claude.ai <name>"). Registering them again with `claude mcp add -s user`
#   produces a broken duplicate ("Needs authentication" — the CLI has no cached
#   OAuth token). Mark such servers `account_connector: true`: the Claude Code
#   registrar (register_claude_code.sh) then skips them, while `desktop:` still
#   bridges them into Claude Desktop (which cannot use account connectors).
#   Codex CLI is unaffected — it has no account sync, so it keeps registering
#   these http servers natively.

mcp_servers:
  obsidian-mcp-tools:
    command: "${HOME}/Library/Mobile Documents/iCloud~md~obsidian/Documents/notes/.obsidian/plugins/mcp-tools/bin/mcp-server"
    platforms:
      - darwin
    env:
      OBSIDIAN_API_KEY:
        ssm: "/mcp/obsidian-api-key"

  ai-memory:
    type: http
    # openmemory was patched to Streamable HTTP (cookbooks/lxc-memory patches/
    # mcp-server.py mounts streamable_http_app() at /mcp, removing the old
    # SSE-only routes). The endpoint is /memory/mcp (nginx strips the /memory
    # prefix → auth-proxy /mcp → openmemory-api). The legacy SSE path
    # /memory/mcp/claude/sse/shin1ohno no longer serves MCP — a client pinned to
    # it authenticates fine but then "Failed to connect" at the SSE handshake.
    # transport http against the /mcp endpoint.
    transport: http
    url: "https://mcp.ohno.be/memory/mcp"
    desktop: mcp-remote
    # Also a claude.ai account connector ("claude.ai memory") — synced into
    # Claude Code automatically. Skip user-scope registration (see header).
    account_connector: true

  roon:
    type: http
    transport: sse
    url: "https://mcp.ohno.be/roon/sse"
    desktop: mcp-remote
    # claude.ai account connector ("claude.ai roon") — see header.
    account_connector: true
